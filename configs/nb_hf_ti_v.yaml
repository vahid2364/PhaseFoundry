# ─────────────────────────────────────────────────────────────────────────────
# Nb-Hf-Ti-V Quaternary System — Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────

system:
  name:              nb_hf_ti_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, HF, TI, V]       # V is reference; NB, HF, TI are independent
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.01, 0.99]
    HF: [0.01, 0.99]
    TI: [0.01, 0.99]
  n_points:          10                    # coarse sample for testing; with the default
                                            # sampling="sobol", this is a TOTAL target point
                                            # count (not per-axis) — see thermo.sampling below
  temperatures_C:    [500]                 # single temperature for testing

  # Surrogate backend — quaternary always uses RBF→RGI ("auto" selects it).
  # Increase rgi_n_grid for finer G_m resolution (default 20; 30–40 recommended
  # if microstructure differs from a reference run).
  #
  # surrogate_backend: auto   # "auto" | "rbf_rgi"  (auto=rbf_rgi for quaternary+)
  # rgi_n_grid:        20     # grid points per axis of the RGI evaluation grid

simulation:
  temperature_C: 500
  dimensions:    2                 # spatial dimensions: 2 (NxN) or 3 (NxNxN)
  N:             256               # grid points per axis
  Lx:            1.0e-6

  kappa:         [1.0e-12, 1.0e-12, 1.0e-12]

  M:
    - [5.0e-21, 0.0,     0.0    ]
    - [0.0,     5.0e-21, 0.0    ]
    - [0.0,     0.0,     5.0e-21]

  # Close to Nb-V corner: x_NB=0.50, x_HF=0.05, x_TI=0.05, x_V=0.40
  c0:            [0.50, 0.05, 0.05]  # [x_NB, x_HF, x_TI] (independent fields; x_V = 1 - sum)

  noise:         0.01
  seed:          42
  dt:            null
  # Derivative method: "fd" | "jansson" | "hybrid"
  # "jansson" requires /MU and /dMU datasets in the HDF5 table (step 1 default).
  derivative_method: fd
  use_gpu:           false             # use CuPy GPU FFT (requires CuPy)
  adaptive_dt:       false             # adaptive time-stepping
  n_steps:       10000
  save_every:    2500

output:
  data_dir:      data/nb_hf_ti_v
  results_dir:   results/nb_hf_ti_v
  run_name:      auto
