# ─────────────────────────────────────────────────────────────────────────────
# Nb-V Binary — Chemical-Only Spinodal Decomposition at 500 °C  (c0 = 0.30)
# ─────────────────────────────────────────────────────────────────────────────
# No elastic coupling. Thermodynamic data shared with other NbV v2 runs.
#
# Run steps in order:
#   python workflows/01_generate_thermo_data/run.py --config configs/nb_v_chem_c30.yaml  # shared
#   python workflows/03_simulate/run.py             --config configs/nb_v_chem_c30.yaml

system:
  name:              nb_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, V]
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.999]
  n_points:          200
  temperatures_C:    [400,500,600,700,800,900,1000]

simulation:
  temperature_C: 500
  dimensions:    2
  N:             128
  Lx:            1.0e-6
  kappa:         1.0e-12
  M:             5.0e-21
  c0:            0.30              # mean x_NB (independent field; x_V = 1 - x_NB)
  noise:         0.01
  seed:          42
  dt:            1.0e-2
  derivative_method: jansson
  use_gpu:           false
  adaptive_dt:       false
  n_steps:       100000
  save_every:    10000

output:
  data_dir:      data/HfNbTiV_BCC_PhaseForge_v2/NbV
  results_dir:   results/HfNbTiV_BCC_PhaseForge_v2/NbV
  run_name:      auto
