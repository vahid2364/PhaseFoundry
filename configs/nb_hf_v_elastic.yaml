# Nb-Hf-V Ternary — Elasto-Chemical Spinodal Decomposition at 500 °C
# Tensorial Vegard eigenstrain (Λ tensor, shape N_ind×d×d) coupled to
# Cahn-Hilliard via CALPHAD thermodynamics (PhaseForge v2 TDB).
# SQS/DFT elastic constants from PhaseForge v2 CSV.
#
# Run steps in order:
#   python workflows/01_generate_thermo_data/run.py --config configs/nb_hf_v_elastic.yaml
#   python workflows/01b_lookup_elastic/run.py      --config configs/nb_hf_v_elastic.yaml
#   python workflows/03_simulate/run.py             --config configs/nb_hf_v_elastic.yaml

system:
  name:              nb_hf_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, HF, V]        # V is reference; NB and HF are independent
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.998]
    HF: [0.001, 0.998]
  n_points:          20                 # 20×20 grid → ~210 valid simplex points
  temperatures_C:    [500]

simulation:
  temperature_C: 500
  dimensions:    2
  N:             256
  Lx:            1.0e-6

  kappa:         [1.0e-12, 7.0e-12]   # [J·m²/mol]: κ_NB, κ_HF

  # Mobility matrix 2×2 [m⁵/(J·s)]: M_NbNb, M_NbHf / M_HfNb, M_HfHf
  M:
    - [5.0e-21, 0.0    ]
    - [0.0,     5.0e-23]

  c0:            [0.60, 0.05]      # [x_NB, x_HF] (independent fields; x_V = 1 - x_NB - x_HF = 0.35)

  noise:         0.01
  seed:          42
  dt:            null                   # auto stable dt
  derivative_method: fd
  use_gpu:           false
  adaptive_dt:       false
  n_steps:       100000
  save_every:    10000

  elastic:
    enabled:      true

    stiffness_model: cubic_csv
    elastic_csv:  data/HfNbTiV_BCC_PhaseForge_v2/sqs_elastic_constants_HfNbVTi-orb-v2.csv

    # Endpoint compositions for step 1b interpolation.
    # Placeholder: use approximate Nb-rich and Hf/V-rich tie-line ends.
    # Update these after running step 1 (CALPHAD equilibrium at 500°C).
    c_mat: {NB: 0.70, HF: 0.05, V: 0.25}   # Nb-rich matrix (placeholder)
    c_ppt: {NB: 0.20, HF: 0.15, V: 0.65}   # V-rich precipitate (placeholder)

    # Vegard tensor Λ: α_k per independent element (NB, HF) computed by step 1b
    # via central finite differences on the lattice-parameter interpolant.
    # No manual input needed — step 1b writes alpha to elastic_params.yaml.

    solve_every:  10
    warm_start:   true
    tol:          1.0e-5
    max_iter:     500

    save_fields:  true

output:
  data_dir:      data/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  results_dir:   results/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  run_name:      auto
