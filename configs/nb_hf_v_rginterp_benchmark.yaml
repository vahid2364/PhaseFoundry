# ─────────────────────────────────────────────────────────────────────────────
# Nb-Hf-V Ternary — RegularGridInterpolator (RBF→RGI) benchmark
# Same run as nb_hf_v_paper_benchmark.yaml but forces the RBF→RGI two-stage
# surrogate instead of the default CloughTocher2D (CT2D).
#
# Purpose: compare throughput between CT2D (default) and RBF→RGI backends
# for the ternary case.  Run side-by-side with nb_hf_v_paper_benchmark.yaml
# and compare steps/s from timings.jsonl.
#
# Run steps in order:
#   pf-generate    --config configs/nb_hf_v_rginterp_benchmark.yaml
#   pf-surrogate   --config configs/nb_hf_v_rginterp_benchmark.yaml
#   pf-simulate    --config configs/nb_hf_v_rginterp_benchmark.yaml
#
# Or all at once:
#   pf-run-all     --config configs/nb_hf_v_rginterp_benchmark.yaml
# ─────────────────────────────────────────────────────────────────────────────

system:
  name:              nb_hf_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, HF, V]
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.999]
    HF: [0.001, 0.999]
  n_points:          20                  # 20×20 → ~210 valid simplex points
  temperatures_C:    [500]
  surrogate_backend: rbf_rgi             # "auto" | "rbf_rgi"  — forces RBF→RGI (bypasses CT2D)
  rgi_n_grid:        20                  # grid points per axis; 20→247 steps/s (inaccurate), 40→614 steps/s

simulation:
  temperature_C: 500
  dimensions:    2
  N:             128                     # 128² grid — matches paper benchmark
  Lx:            1.0e-6

  kappa:         [1.0e-12, 7.0e-12]     # [κ_NB, κ_HF]  J·m²/mol

  M:
    - [5.0e-21, 0.0    ]                # M_NbNb, M_NbHf
    - [0.0,     5.0e-23]                # M_HfNb, M_HfHf

  c0:            [0.50, 0.10]           # x_NB = 0.50, x_HF = 0.10, x_V = 0.40

  noise:              0.01
  seed:               42
  dt:                 0.5
  derivative_method:  jansson
  use_gpu:            false
  adaptive_dt:        false
  n_steps:            20000
  save_every:         5000

output:
  data_dir:    data/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  results_dir: results/paper_benchmark/NbHfV_rgi
  run_name:    auto

# ── Logging — captures timing for throughput comparison ──────────────────────
logging:
  enabled:           true
  level:             info
  log_file:          auto
  timings_file:      auto
  progress_interval: 1000
  track_memory:      true
  fingerprint:       true
  pipeline_summary:  true
