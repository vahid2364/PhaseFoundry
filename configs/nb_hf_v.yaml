# ─────────────────────────────────────────────────────────────────────────────
# Nb-Hf-V Ternary System — Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Run with the general workflow scripts:
#   python workflows/01_generate_thermo_data/run.py --config configs/nb_hf_v.yaml
#   python workflows/02_fit_surrogate/run.py        --config configs/nb_hf_v.yaml
#   python workflows/03_simulate/run.py             --config configs/nb_hf_v.yaml

system:
  name:              nb_hf_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v3.tdb
  elements:          [NB, HF, V]        # V is reference; NB and HF are independent
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.999]                  # independent element 1
    HF: [0.001, 0.999]                  # independent element 2
  n_points:          20                 # 20×20 grid → ~210 valid simplex points
  temperatures_C:    [300, 400, 500, 600, 700, 800, 900, 1000]

simulation:
  temperature_C: 500
  dimensions:    2                 # spatial dimensions: 2 (NxN) or 3 (NxNxN)
  N:             256               # grid points per axis
  Lx:            1.0e-6

  # Gradient energy: one κ per independent field [J·m²/mol]
  #   kappa[0] → x_NB field
  #   kappa[1] → x_HF field
  # κ_Hf scaled to H ratio |H_HF|/|H_NB| ≈ 7.4 to maintain comparable
  # interface widths (δ ~ sqrt(κ/|H|)) for both elements.
  kappa:         [1.0e-12, 7.0e-12]

  # Mobility matrix 2×2 [m⁵/(J·s)]
  #   M[i][j] = mobility coupling field i to field j
  #   Diagonal = self-diffusion; off-diagonal = cross-diffusion
  # M_Hf ~100x smaller than M_Nb: Hf is larger (159 pm vs 146 pm for Nb)
  # and diffuses significantly slower in BCC at 500°C.
  M:
    - [5.0e-21, 0.0    ]              # M_NbNb, M_NbHf
    - [0.0,     5.0e-23]              # M_HfNb, M_HfHf

  # Mean composition: [x_NB, x_HF]; x_V = 1 - 0.50 - 0.10 = 0.40
  # Nb-V rich with small Hf addition — mirrors binary Nb-V c0=0.40 case
  c0:            [0.50, 0.10]      # [x_NB, x_HF] (independent fields; x_V = 1 - x_NB - x_HF)

  noise:         0.01
  seed:          42
  dt:            null                   # auto stable dt
  # Derivative method: "fd" | "jansson" | "hybrid"
  # "jansson" requires /MU and /dMU datasets in the HDF5 table (step 1 default).
  derivative_method: fd
  use_gpu:           false             # use CuPy GPU FFT (requires CuPy)
  adaptive_dt:       false             # adaptive time-stepping
  n_steps:       30000
  save_every:    5000

  # Elastic coupling (Gururajan & Abinandanan 2007) — off by default.
  # Uncomment and fill in material parameters to enable.
  # elastic:
  #   enabled:      true
  #   G_matrix:     40.0e9      # matrix shear modulus [Pa]
  #   delta:        1.0         # G_ppt / G_matrix  (1.0 = homogeneous stiffness)
  #   nu:           0.3         # Poisson's ratio (both phases, isotropic)
  #
  #   # Eigenstrain model — choose one:
  #   #   "uniform": constant eps_T (precipitate/matrix misfit)
  #   #   "vegard":  linear in composition via Vegard's law (spinodal default)
  #   eigenstrain_model: vegard
  #   a_matrix:     3.3008      # lattice param of c=0 phase [Å]  (e.g. Nb BCC)
  #   a_ppt:        3.0274      # lattice param of c=1 phase [Å]  (e.g. V  BCC)
  #   # -- or, for uniform model: --
  #   # eigenstrain_model: uniform
  #   # eps_T:      0.01        # dilatational eigenstrain  ε*
  #
  #   solve_every:  5           # re-solve every N CH steps (1 = every step)
  #   warm_start:   true        # use previous displacement as initial guess
  #   tol:          1.0e-6      # inner-loop convergence tolerance
  #   max_iter:     300         # inner-loop max iterations

output:
  data_dir:      data/HfNbTiV_BCC_PhaseForge_v3/NbHfV
  results_dir:   results/HfNbTiV_BCC_PhaseForge_v3/NbHfV
  # run_name: pf_c{Nb mol%}Nb{Hf mol%}Hf_kappa{val}_{tdb_tag}
  run_name:      auto
