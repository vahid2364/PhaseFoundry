# Hf-V Binary System — Pipeline Configuration
system:
  name:              hf_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [HF, V]
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    HF: [0.001, 0.999]
  n_points:          200
  temperatures_C:    [25, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950, 1000, 1025, 1050, 1075, 1100, 1150, 1200, 1250, 1300]

simulation:
  temperature_C: 500
  dimensions:    2                 # spatial dimensions: 2 (NxN) or 3 (NxNxN)
  N:             256               # grid points per axis
  Lx:            1.0e-6
  kappa:         1.0e-11         # λ*≈223nm (57 grid pts), 6 unstable modes in 1μm domain; growth ~2.8e-4/step
  M:             5.0e-21
  c0:            0.524          # midpoint of spinodal at 500°C in x_V space; |f''|≈-31831 J/mol
  noise:         0.01
  seed:          42
  dt:            null           # auto stable dt
  # Derivative method: "fd" | "jansson" | "hybrid"
  derivative_method: fd
  use_gpu:           false             # use CuPy GPU FFT (requires CuPy)
  adaptive_dt:       false
  n_steps:       15000
  save_every:    2500

output:
  data_dir:      data/hf_v
  results_dir:   results/hf_v
  # run_name pattern: pf_{ndim}d_c{mol%}Hf_kappa{val}_M{val}_{tdb_tag}
  run_name:      auto
