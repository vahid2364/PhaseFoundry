# ─────────────────────────────────────────────────────────────────────────────
# Nb-Hf-V Ternary — Elasto-Chemical Spinodal Decomposition at 500 °C
# Composition: x_NB = 0.50, x_HF = 0.25, x_V = 0.25
# ─────────────────────────────────────────────────────────────────────────────
# Tensorial Vegard eigenstrain coupled to Cahn-Hilliard via CALPHAD (v2 TDB).
# SQS/DFT elastic constants from PhaseForge v2 CSV.
# Thermodynamic data shared with nb_hf_v_chem_cNb50V25Hf25.yaml (step 1 shared).
#
# Run steps in order:
#   python workflows/01_generate_thermo_data/run.py --config configs/nb_hf_v_elastic_cNb50V25Hf25.yaml  # shared with chem-only
#   python workflows/02_fit_surrogate/run.py        --config configs/nb_hf_v_elastic_cNb50V25Hf25.yaml  # shared with chem-only
#   python workflows/01b_lookup_elastic/run.py      --config configs/nb_hf_v_elastic_cNb50V25Hf25.yaml
#   python workflows/03_simulate/run.py             --config configs/nb_hf_v_elastic_cNb50V25Hf25.yaml

system:
  name:              nb_hf_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, HF, V]        # V is reference; NB and HF are independent
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.999]                  # independent element 1
    HF: [0.001, 0.999]                  # independent element 2
  n_points:          20                 # 20×20 grid → ~210 valid simplex points
  temperatures_C:    [500]

simulation:
  temperature_C: 500
  dimensions:    2
  N:             128
  Lx:            1.0e-6

  # Gradient energy: one κ per independent field [J·m²/mol]
  #   kappa[0] → x_NB field
  #   kappa[1] → x_HF field
  kappa:         [1.0e-12, 7.0e-12]

  # Mobility matrix 2×2 [m⁵/(J·s)]
  # M_HF ~100× smaller than M_NB: Hf is larger and diffuses slower at 500 °C.
  M:
    - [5.0e-21, 0.0    ]              # M_NbNb, M_NbHf
    - [0.0,     5.0e-23]              # M_HfNb, M_HfHf

  # Mean composition: x_NB = 0.50, x_HF = 0.25 → x_V = 0.25
  c0:            [0.50, 0.25]         # [x_NB, x_HF] (independent fields; x_V = 1 - x_NB - x_HF)

  noise:         0.01
  seed:          42
  dt:            0.05
  derivative_method: jansson
  use_gpu:           false
  adaptive_dt:       false
  n_steps:       600000
  save_every:    100000

  elastic:
    enabled:      true

    # ── Stiffness model ───────────────────────────────────────────────────────
    stiffness_model: cubic_csv
    eigenstrain_model: local_vegard
    elastic_csv:  data/HfNbTiV_BCC_PhaseForge_v2/sqs_elastic_constants_HfNbVTi-orb-v2.csv

    # Approximate tie-line endpoints at 500 °C for step 1b interpolation.
    # These are placeholder estimates, not a verified CALPHAD-computed
    # tie-line — run workflows/01c_calphad_tieline/run.py (or inspect the
    # ternary phase map from 01d_phase_map) and refine before relying on
    # these for quantitative results. (This mismatch is also what
    # Reviewer 4's Table 6 mass-balance comment on the Kunselman paper
    # caught: the endpoints below do not actually balance against the
    # Nb50Hf25V25 parent composition.)
    c_mat: {NB: 0.70, HF: 0.10, V: 0.20}
    c_ppt: {NB: 0.15, HF: 0.35, V: 0.50}

    # Vegard tensor Λ: α_NB and α_HF computed by step 1b via finite differences
    # on the lattice-parameter interpolant. No manual input needed.

    solve_every:  10
    warm_start:   true
    tol:          1.0e-5
    max_iter:     500

    save_fields:  true

output:
  data_dir:      data/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  results_dir:   results/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  run_name:      auto
