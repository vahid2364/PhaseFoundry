# ─────────────────────────────────────────────────────────────────────────────
# Nb-V Binary — Binodal/Spinodal Boundary Calculation at 3 Temperatures
# ─────────────────────────────────────────────────────────────────────────────
# Thermodynamics-only: no phase-field simulation is run from this config.
# Computes binodal (common-tangent) and spinodal (d^2G/dx^2=0) boundaries at
# three temperatures spanning deep-in-the-gap, near-critical, and
# above-critical behavior for Nb-V BCC_A2.
#
# Thermodynamic data (HDF5 tables) are shared with the other NbV v2 configs —
# data_dir already has tables cached at several more temperatures than the
# three configured below, so Step 2's phase diagram reflects all of them.
#
# Run steps in order:
#   python workflows/01_generate_thermo_data/run.py --config configs/nb_v_binodal_spinodal_3T.yaml
#   python workflows/02_fit_surrogate/run.py         --config configs/nb_v_binodal_spinodal_3T.yaml

system:
  name:              nb_v
  db_path:           data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:          [NB, V]
  phase:             BCC_A2
  reference_element: V

thermo:
  composition_ranges:
    NB: [0.001, 0.999]
  n_points:          200
  temperatures_C:    [500, 900, 1200]   # deep in gap / near T_c / above T_c

# Only `temperature_C` is actually read by Steps 1-2 (as an output-folder
# label) -- none of the other phase-field parameters a `simulation:` block
# normally carries (N, kappa, M, dt, n_steps, ...) are touched by this
# thermodynamics-only pipeline. `run_name` is set explicitly below instead
# of "auto" specifically so that c0/kappa/M don't need to be present either
# (the "auto" run-name builder reads them to construct a label) -- see the
# tutorial for the full explanation.
simulation:
  temperature_C: 500

output:
  data_dir:      data/HfNbTiV_BCC_PhaseForge_v2/NbV
  results_dir:   results/HfNbTiV_BCC_PhaseForge_v2/NbV
  run_name:      binodal_spinodal_3T
