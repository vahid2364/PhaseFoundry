# Nb-Hf-V Ternary — Elasto-Chemical Spinodal Decomposition at 500 °C
# Composition: x_NB = 0.50, x_HF = 0.35, x_V = 0.15
# Run: 01_generate_thermo_data → 02_fit_surrogate → 01b_lookup_elastic → 03_simulate
system:
  name: nb_hf_v
  db_path: data/tdb/HfNbTiV_BCC_PhaseForge_v2_Tdep.tdb
  elements:
  - NB
  - HF
  - V
  phase: BCC_A2
  reference_element: V
thermo:
  composition_ranges:
    NB:
    - 0.001
    - 0.999
    HF:
    - 0.001
    - 0.999
  n_points: 20
  temperatures_C:
  - 500
simulation:
  temperature_C: 500
  dimensions: 2
  N: 128
  Lx: 1.0e-06
  kappa:
  - 1.0e-12
  - 7.0e-12
  M:
  - - 5.0e-21
    - 0.0
  - - 0.0
    - 5.0e-23
  c0:
  - 0.5
  - 0.35
  noise: 0.01
  seed: 42
  dt: 0.05
  derivative_method: jansson
  use_gpu: false
  adaptive_dt: false
  n_steps: 300000
  save_every: 50000
  elastic:
    enabled: true
    stiffness_model: cubic_csv
    eigenstrain_model: local_vegard
    elastic_csv: data/HfNbTiV_BCC_PhaseForge_v2/sqs_elastic_constants_HfNbVTi-orb-v2.csv
    c_mat:
      NB: 0.68
      HF: 0.18
      V: 0.14
    c_ppt:
      NB: 0.14
      HF: 0.44
      V: 0.42
    solve_every: 10
    warm_start: true
    tol: 1.0e-05
    max_iter: 500
    save_fields: true
output:
  data_dir: data/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  results_dir: results/HfNbTiV_BCC_PhaseForge_v2/NbHfV
  run_name: auto
