name: Lint

on:
  push:
    branches: [main, develop-new]
  pull_request:
    branches: [main, develop-new]
  workflow_call:

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra mlip

      - name: Run prek
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: '0.5.6'
