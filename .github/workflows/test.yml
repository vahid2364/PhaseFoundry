name: Tests

on:
  push:
    branches: [main, develop-new]
  pull_request:
    branches: [main, develop-new]
  workflow_call:

jobs:
  test:
    name: Run Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.python-version == '3.12' && '--extra mlip' || '' }}

      - name: Run tests
        run: uv run pytest tests/
