site_name: PhaseFoundry
site_description: CALPHAD-coupled phase-field modeling toolkit
site_url: https://vahid2364.github.io/PhaseFoundry/
site_author: Vahid Attari
repo_url: https://github.com/vahid2364/PhaseFoundry
repo_name: vahid2364/PhaseFoundry
edit_uri: edit/develop-new/docs/
copyright: "&copy; 2026 Vahid Attari"

docs_dir: docs

plugins:
  - search
  - social
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

theme:
  name: material
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Installation: installation.md
  - CLI Reference: cli_reference.md
  - Tutorial — Validating Derivatives Against Finite Differences: tutorial_derivative_validation.md
  - Tutorial — Binodal/Spinodal at 3 Temperatures: tutorial_binodal_spinodal_3T.md
  - Tutorial — Binary Tie-Lines (3-way check): tutorial_binary_tieline.md
  - Tutorial — 2D Binary Walkthrough: tutorial_2d_binary.md
  - Tutorial — Hessian Stability Analysis (Binary): tutorial_hessian_stability_binary.md
  - Tutorial — Coherent-Hessian Stability Analysis (Quaternary): tutorial_coherent_hessian_quaternary.md
  - Tutorial — Plane-Strain Eigenstrain Closure: tutorial_plane_strain_closure.md
  - Tutorial — 2D Ternary Elasto-Chemical: tutorial_2d_ternary_elastic.md
  - Tutorial — Tie-Lines & Phase Maps (Ternary): tutorial_tieline_phase_map.md

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - pymdownx.details
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vahid-attari-0851a926/
      name: Vahid Attari on LinkedIn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
