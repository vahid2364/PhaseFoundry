[project]
name = "phasefoundry"
version = "0.1.0"
description = "Integrated CALPHAD / phase-field modelling toolkit for multicomponent alloys"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Vahid Attari", email = "attari.v@gmail.com" },
    { name = "Doguhan Sariturk", email = "doguhan.sariturk@gmail.com" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pycalphad>=0.11",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tqdm>=4.65",
]

[project.optional-dependencies]
mlip = ["materialsframework[sqsgen,calphad]>=1.0.0"]
plot = [
    "python-ternary>=1.0.8",
    "pyvista>=0.40",
    "umap-learn>=0.5",
]
gpu = ["cupy-cuda12x>=13.0; sys_platform != 'darwin'"]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.0.2",
    "ruff>=0.16.9",
    "ty>=0.0.85",
]

[project.urls]
Home-page = "https://github.com/vahid2364/PhaseFoundry/"
Issues = "https://github.com/vahid2364/PhaseFoundry/issues"
Repository = "https://github.com/vahid2364/PhaseFoundry.git"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
    "mlip: requires MaterialsFramework",
]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
line-length = 130
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "E", # pycodestyle Errors
    "ERA", # Eradicate
    "F", # Pyflakes
    "FA", # flake8-future-annotations
    "I", # isort
    "ICN", # flake8-import-conventions
    "N", # pep8-naming
    "PL", # Pylint
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "UP", # pyupgrade
    "W", # pycodestyle Warnings
]
ignore = [
    "N802", # function name should be lowercase
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "PLC0415", # import outside top-level
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value used in comparison
]
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
    "src",
    "tests",
]
